<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNISONA 排練紀錄</title>
<meta name="description" content="UNISONA 合唱團的互動排練">
<meta name="theme-color" content="#fdf4e6">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div id="hud-brand">UNISONA</div>
      <div id="hud-controls"></div>
    </header>

    <main id="scene-root" tabindex="-1"></main>

    <p id="caption" aria-live="polite"></p>
  </div>

  <div id="resume-layer" hidden>
    <div id="resume-card">
      <p id="resume-text">排練暫停了。</p>
      <button type="button" id="resume-button">繼續</button>
    </div>
  </div>

  <noscript>
    <p style="padding:1.5rem;text-align:center">這個頁面需要開啟 JavaScript 才能遊玩。</p>
  </noscript>

  <script type="module" src="./src/main.js"></script>
