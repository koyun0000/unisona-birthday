<svg xmlns="http://www.w3.org/2000/svg" width="480" height="840" viewBox="0 0 480 840">
  <title>UNISONA 團員範本（舉牌｜雙手舉過頭 ＋ 張嘴在唱）</title>
  <rect width="480" height="840" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="479" height="839" fill="none" stroke="rgba(47,42,38,0.28)" stroke-width="2"/>
  <line x1="240" y1="0" x2="240" y2="840" stroke="#c9742c" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <line x1="0" y1="750" x2="480" y2="750" stroke="#c9742c" stroke-width="3"/>
  <text x="12" y="738" font-family="sans-serif" font-size="22" fill="#c9742c" text-anchor="start">腳底線　腳要踩在這條線上</text>
  <line x1="0" y1="246" x2="480" y2="246" stroke="rgba(47,42,38,0.28)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="12" y="236" font-family="sans-serif" font-size="18" fill="rgba(47,42,38,0.28)" text-anchor="start">頭頂參考線（可以超過一點）</text>
  <circle cx="240" cy="441" r="48" fill="none" stroke="#c9742c" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="298" y="447" font-family="sans-serif" font-size="18" fill="#c9742c" text-anchor="start">胸前徽章（程式會蓋上去，這裡留白）</text>
  <rect x="177" y="141" width="126" height="96" rx="30" fill="none" stroke="#c9742c" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="312" y="195" font-family="sans-serif" font-size="18" fill="#c9742c" text-anchor="start">頭上名牌（程式會蓋上去）</text>
  <rect x="96" y="471" width="108" height="84" fill="none" stroke="rgba(47,42,38,0.28)" stroke-width="3" stroke-dasharray="4 6"/>
  <text x="12" y="573" font-family="sans-serif" font-size="16" fill="rgba(47,42,38,0.28)" text-anchor="start">主角的工作證會掛在這裡（玩家畫的）</text>
  <rect x="147" y="-6" width="186" height="150" fill="none" stroke="#c9742c" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="343" y="69" font-family="sans-serif" font-size="17" fill="#c9742c" text-anchor="start">UNISONA 牌子會出現在這裡</text>
  <text x="343" y="93" font-family="sans-serif" font-size="15" fill="rgba(47,42,38,0.28)" text-anchor="start">手請畫成托住這個框的下緣</text>
  <text x="12" y="34" font-family="sans-serif" font-size="30" fill="#c9742c" text-anchor="start">舉牌｜雙手舉過頭 ＋ 張嘴在唱</text>
  <text x="468" y="824" font-family="sans-serif" font-size="16" fill="rgba(47,42,38,0.28)" text-anchor="end">480 x 840 px，存成去背 PNG</text>
</svg>
