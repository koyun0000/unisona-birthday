<svg xmlns="http://www.w3.org/2000/svg" width="186" height="150" viewBox="0 0 186 150">
  <title>舉牌・空白牌面</title>
  <rect width="186" height="150" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="185" height="149" fill="none" stroke="rgba(47,42,38,0.28)" stroke-width="2"/>
  <line x1="93" y1="0" x2="93" y2="150" stroke="#c9742c" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <line x1="0" y1="75" x2="186" y2="75" stroke="#c9742c" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <text x="14" y="34" font-family="sans-serif" font-size="26" fill="#c9742c" text-anchor="start">舉牌・空白牌面</text>
  <text x="14" y="64" font-family="sans-serif" font-size="18" fill="rgba(47,42,38,0.28)" text-anchor="start">字母由程式用文字畫上去，</text>
  <text x="14" y="90" font-family="sans-serif" font-size="18" fill="rgba(47,42,38,0.28)" text-anchor="start">所以這張請畫空白的牌子就好。</text>
  <text x="174" y="136" font-family="sans-serif" font-size="15" fill="rgba(47,42,38,0.28)" text-anchor="end">186 x 150 px</text>
</svg>
