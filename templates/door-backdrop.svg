<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="760" viewBox="0 0 2000 760">
  <title>後台入口背景</title>
  <rect width="2000" height="760" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1999" height="759" fill="none" stroke="rgba(47,42,38,0.28)" stroke-width="2"/>
  <line x1="1000" y1="0" x2="1000" y2="760" stroke="#c9742c" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <line x1="0" y1="380" x2="2000" y2="380" stroke="#c9742c" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <text x="14" y="34" font-family="sans-serif" font-size="26" fill="#c9742c" text-anchor="start">後台入口背景</text>
  <text x="14" y="64" font-family="sans-serif" font-size="18" fill="rgba(47,42,38,0.28)" text-anchor="start">門片與感應器不要畫進去（它們會動）。</text>
  <text x="14" y="90" font-family="sans-serif" font-size="18" fill="rgba(47,42,38,0.28)" text-anchor="start">門框可以畫。</text>
  <text x="1988" y="746" font-family="sans-serif" font-size="15" fill="rgba(47,42,38,0.28)" text-anchor="end">2000 x 760 px</text>
</svg>
