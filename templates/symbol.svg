<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>徽章</title>
  <rect width="128" height="128" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="127" height="127" fill="none" stroke="rgba(47,42,38,0.28)" stroke-width="2"/>
  <line x1="64" y1="0" x2="64" y2="128" stroke="#c9742c" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <line x1="0" y1="64" x2="128" y2="64" stroke="#c9742c" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <text x="14" y="34" font-family="sans-serif" font-size="26" fill="#c9742c" text-anchor="start">徽章</text>
  <text x="14" y="64" font-family="sans-serif" font-size="18" fill="rgba(47,42,38,0.28)" text-anchor="start">七個各一張，圖案置中。</text>
  <text x="14" y="90" font-family="sans-serif" font-size="18" fill="rgba(47,42,38,0.28)" text-anchor="start">線條粗一點，縮到很小也要認得出來。</text>
  <text x="14" y="116" font-family="sans-serif" font-size="18" fill="rgba(47,42,38,0.28)" text-anchor="start">去背 PNG。</text>
  <text x="116" y="114" font-family="sans-serif" font-size="15" fill="rgba(47,42,38,0.28)" text-anchor="end">128 x 128 px</text>
</svg>
